<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeChat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: #090b12;
    color: white;
    font-family: Arial, sans-serif;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #10131d;
}

.topbar {
    padding: 18px 22px;
    background: #131722;
    border-bottom: 1px solid #292e3d;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 26px;
    font-weight: bold;
}

.status {
    margin-top: 5px;
    color: #9da6ba;
    font-size: 13px;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #35e77a;
    margin-right: 6px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    max-width: 75%;
    padding: 12px 15px;
    border-radius: 15px;
    background: #1b2030;
    align-self: flex-start;
    word-wrap: break-word;
}

.message.mine {
    align-self: flex-end;
    background: #315cff;
}

.username {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
}

.time {
    opacity: .6;
    font-weight: normal;
    margin-left: 7px;
}

.text {
    font-size: 15px;
    line-height: 1.4;
}

.empty {
    margin: auto;
    text-align: center;
    color: #7f899e;
}

.composer {
    padding: 15px;
    background: #131722;
    border-top: 1px solid #292e3d;
    display: flex;
    gap: 9px;
}

input {
    background: #0c0f17;
    color: white;
    border: 1px solid #30374a;
    border-radius: 10px;
    padding: 12px;
    outline: none;
}

input:focus {
    border-color: #5578ff;
}

#username {
    width: 150px;
}

#message {
    flex: 1;
}

button {
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    background: #315cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #466dff;
}

.sent {
    font-size: 11px;
    margin-left: 7px;
    opacity: .8;
}

@media(max-width:600px) {
    #username {
        width: 100px;
    }

    .message {
        max-width: 88%;
    }

    .messages {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div>
            <div class="title">💬 VibeChat</div>

            <div class="status">
                <span class="dot"></span>
                <span id="connectionStatus">Connecting...</span>
            </div>
        </div>

    </header>


    <main id="messages" class="messages">

        <div class="empty" id="empty">
            Connecting to VibeChat...
        </div>

    </main>


    <form class="composer" id="chatForm">

        <input
            id="username"
            maxlength="24"
            placeholder="Your name"
            autocomplete="nickname"
        >

        <input
            id="message"
            maxlength="500"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button type="submit">
            Send
        </button>

    </form>

</div>


<script>

const topic = "vibechat-7f4k2m9x";

const usernameInput =
    document.getElementById("username");

const messageInput =
    document.getElementById("message");

const messages =
    document.getElementById("messages");

const empty =
    document.getElementById("empty");

const status =
    document.getElementById("connectionStatus");

const form =
    document.getElementById("chatForm");


let myUsername =
    localStorage.getItem("vibechat_username") || "";


usernameInput.value = myUsername;


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function addMessage(username, text, time, mine = false) {

    if (empty) {
        empty.remove();
    }

    const bubble =
        document.createElement("div");

    bubble.className =
        "message" + (mine ? " mine" : "");


    const safeUsername =
        escapeHTML(username);

    const safeText =
        escapeHTML(text);


    bubble.innerHTML = `
        <div class="username">
            ${safeUsername}
            <span class="time">${time}</span>
            ${mine ? '<span class="sent">✓ Sent</span>' : ''}
        </div>

        <div class="text">
            ${safeText}
        </div>
    `;


    messages.appendChild(bubble);

    messages.scrollTop =
        messages.scrollHeight;
}


function connect() {

    const url =
        "https://ntfy.sh/" +
        topic +
        "/sse";


    const stream =
        new EventSource(url);


    stream.onopen = () => {

        status.textContent =
            "Connected";

    };


    stream.onmessage = event => {

        try {

            const data =
                JSON.parse(event.data);


            if (data.event !== "message") {
                return;
            }


            const parts =
                data.message.split("|");


            if (parts.length < 2) {
                return;
            }


            const username =
                parts.shift();

            const text =
                parts.join("|");


            const date =
                new Date(data.time * 1000);


            const time =
                date.toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });


            const mine =
                username ===
                usernameInput.value.trim();


            addMessage(
                username,
                text,
                time,
                mine
            );

        }

        catch(error) {

            console.log(
                "Message error:",
                error
            );

        }

    };


    stream.onerror = () => {

        status.textContent =
            "Reconnecting...";

    };

}


form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const username =
            usernameInput.value.trim() ||
            "Anonymous";


        const text =
            messageInput.value.trim();


        if (!text) {
            return;
        }


        localStorage.setItem(
            "vibechat_username",
            username
        );


        try {

            const response =
                await fetch(
                    "https://ntfy.sh/" + topic,
                    {
                        method: "POST",
                        body:
                            username +
                            "|" +
                            text
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Send failed"
                );

            }


            messageInput.value = "";

            messageInput.focus();

        }

        catch(error) {

            alert(
                "Couldn't send the message. Try again."
            );

            console.error(error);

        }

    }
);


connect();

</script>

</body>
</html>
