========================================= */

function makeId(){

if(crypto.randomUUID){
return crypto.randomUUID();
}

return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
.replace(
/[xy]/g,
c=>{

const r=Math.random()*16|0;

const v=
c==="x"
?r
:(r&3|8);

return v.toString(16);

}
);

}


async function hashPassword(password){

const data=
new TextEncoder().encode(password);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return Array.from(
new Uint8Array(hash)
)
.map(
b=>b.toString(16).padStart(2,"0")
)
.join("");

}

getAccounts();


/* SIGNUP */

if(authMode==="signup"){

if(accounts.some(
a=>
a.username.toLowerCase()===
username.toLowerCase()
)){

authError(
"That username is already taken."
);

return;

}


const passwordHash=
await hashPassword(password);


const account={

id:makeId(),

username:username,

passwordHash:passwordHash,

createdAt:new Date().toISOString()

};


accounts.push(account);

saveAccounts(accounts);


localStorage.setItem(
SESSION_KEY,
JSON.stringify({
id:account.id,
username:account.username,
owner:false
})
);


await startUser(
account.id,
account.username,
false
);

return;

}


/* LOGIN */

const account=
accounts.find(
a=>
a.username.toLowerCase()===
username.toLowerCase()
);


if(!account){

authError(
"Username or password is incorrect."
);

return;

}


const passwordHash=
await hashPassword(password);


if(passwordHash!==account.passwordHash){

authError(
"Username or password is incorrect."
);

return;

}


localStorage.setItem(
SESSION_KEY,
JSON.stringify({
id:account.id,
username:account.username,
owner:false
})
);


await startUser(
account.id,
account.username,
false
);


}catch(e){

console.error(e);

authError(
"Login failed: "+
(e.message||"Unknown error")
);

}

}

/* =========================================
   MESSAGE ELEMENT
========================================= */

function sameUser(a,b){

return a &&
b &&
a.user_id===b.user_id;

}


function addMessageElement(message,previous=null){

const box=
document.getElementById("messages");


const empty=
box.querySelector(".empty");


if(empty){

box.innerHTML="";

}


if(
document.querySelector(
`[data-message-id="${message.id}"]`
)
){

return;

}


const wrapper=
document.createElement("div");


wrapper.className=
"message"+
(
message.user_id===user?.id
?" me"
:""
);


if(
previous &&
sameUser(message,previous)
){

wrapper.classList.add(
"messageGroupStart"
);

}


wrapper.dataset.messageId=
message.id;


const time=
message.created_at
?
new Date(
message.created_at
)
.toLocaleTimeString(
[],
{
hour:"numeric",
minute:"2-digit"
}
)
:"";


const showName=
message.user_id!==user?.id &&
(
!previous ||
previous.user_id!==message.user_id
);


wrapper.innerHTML=`

${
showName
?
`
<div class="messageMeta">
${escapeHtml(
message.username||"User"
)}
</div>
`
:""
}

<div class="messageBubble">

${
message.image_url
?
`<img src="${message.image_url}" style="max-width:260px;border-radius:15px;display:block;cursor:pointer" onclick="window.open('${message.image_url}')">`
:
escapeHtml(message.content||"")
}

</div>

${
time
?
`
<div class="messageTime">
${time}
</div>
`
:""
}

`;


box.appendChild(wrapper);

scrollMessages();

}

========================================= */

function subscribeToChat(id){

if(channel){

try{
sb.removeChannel(channel);
}catch{}

channel=null;

}


channel=
sb
.channel("vibechat-chat-"+id)
.on(
"postgres_changes",
{

event:"INSERT",

schema:"public",

table:"messages",

filter:
"chat_id=eq."+id

},
payload=>{

if(!payload.new){
return;
}


if(payload.new.user_id!==user?.id){

addMessageElement(
payload.new
);

}


})
.subscribe();

}


/* =========================================
   PRESENCE / ONLINE / TYPING
========================================= */

function subscribePresence(){

if(presenceChannel){

try{
sb.removeChannel(presenceChannel);
}catch{}

}


presenceChannel=
sb
.channel("vibechat-presence")
.on(
"presence",
{
event:"sync"
},
()=>{

const state=
presenceChannel.presenceState();

onlineUsers={};

Object.values(state)
.flat()
.forEach(p=>{
if(p.user_id){
onlineUsers[p.user_id]=p;
}
});

updateOnlineStatus();

}
)
.on(
"presence",
{
event:"join"
},
()=>{
updateOnlineStatus();
}
)
.on(
"presence",
{
event:"leave"
},
()=>{
updateOnlineStatus();
}
)
.on(
"broadcast",
{
event:"typing"
},
payload=>{

if(
payload?.payload?.user_id===user?.id
){
return;
}

if(
payload?.payload?.chat_id!==current?.id
){
return;
}

if(
payload?.payload?.username
){

showTyping(
payload.payload.username,
payload.payload.typing
);

}

}
)
.subscribe(
async status=>{

if(status==="SUBSCRIBED"){

await presenceChannel.track({

user_id:user.id,

username:user.username,

online_at:new Date().toISOString()

});

}

}
);

}


function updateOnlineStatus(){

if(!current){
return;
}


const others=
Object.values(onlineUsers)
.filter(
p=>p.user_id!==user?.id
);


const status=
document.getElementById(
"chatStatus"
);


if(current.is_main){

status.textContent=
others.length
?`${others.length} online`
:"No one else online";

}else{

status.textContent=
others.length
?`${others.length} online`
:"Everyone";

}

}

/* =========================================
   RESTORE SESSION
========================================= */

async function restore(){

const raw=
localStorage.getItem(
SESSION_KEY
);


if(!raw){
return;
}


try{

const session=
JSON.parse(raw);


if(session.owner){

let s=
(await sb.auth.getSession())
.data.session;


if(!s?.user){

const r=
await sb.auth.signInAnonymously();

if(r.error){
throw r.error;
}

s=r.data.session;

}


if(!s?.user){

throw new Error(
"Could not restore owner database identity."
);

}


ownerMode=true;

user={
id:s.user.id,
username:OWNER_USERNAME
};

profile={
id:s.user.id,
username:OWNER_USERNAME,
is_owner:true
};


await ensureOwnerProfile();

await enterApp();

return;

}


/* NORMAL USER */

const accounts=
getAccounts();


const account=
accounts.find(
a=>a.id===session.id
);


if(!account){

localStorage.removeItem(
SESSION_KEY
);

return;

}


await startUser(
account.id,
account.username,
false
);


}catch(e){

console.error(
"Session restore:",
e
);


localStorage.removeItem(
SESSION_KEY
);

}

}
