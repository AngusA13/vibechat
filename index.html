<script>

/* ==============================
   VIBECHAT SETTINGS
============================== */

const SUPABASE_URL=
"https://lorkancqficghomqwybb.supabase.co";

const SUPABASE_KEY=
"sb_publishable_cT_xqZqesLJ9lRl1t8dzDA_GTSyR8XB";

const OWNER_USERNAME=
"Angusthe67man";

const OWNER_PASSWORD=
"VibeChatAdmin2026!";

const MAIN_ID=
"00000000-0000-4000-8000-000000000001";

const ACCOUNT_KEY=
"vibechat_accounts";

const SESSION_KEY=
"vibechat_session";

const sb=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let authMode="login";
let user=null;
let profile=null;
let ownerMode=false;
let chats=[];
let current=null;
let channel=null;
let deleteTarget=null;


/* ==============================
   AUTH SCREEN
============================== */

function showAuth(mode){

authMode=mode;

document
.getElementById("loginTab")
.classList.toggle(
"active",
mode==="login"
);

document
.getElementById("signupTab")
.classList.toggle(
"active",
mode==="signup"
);

document
.getElementById("authButton")
.textContent=
mode==="login"
?"Login"
:"Create Account";

document
.getElementById("authError")
.style.display="none";

}


function authError(message){

const box=
document.getElementById("authError");

box.textContent=message;

box.style.display="block";

}


/* ==============================
   LOCAL ACCOUNTS
============================== */

function getAccounts(){

try{

return JSON.parse(
localStorage.getItem(
ACCOUNT_KEY
)||"[]"
);

}catch{

return [];

}

}


function saveAccounts(accounts){

localStorage.setItem(
ACCOUNT_KEY,
JSON.stringify(accounts)
);

}


function makeId(){

if(crypto.randomUUID){
return crypto.randomUUID();
}

return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
.replace(
/[xy]/g,
c=>{

const r=
Math.random()*16|0;

const v=
c==="x"
?r
:(r&3|8);

return v.toString(16);

}
);

}


async function hashPassword(password){

const data=
new TextEncoder()
.encode(password);

const hash=
await crypto.subtle.digest(
"SHA-256",
data
);

return Array.from(
new Uint8Array(hash)
)
.map(
b=>b.toString(16).padStart(2,"0")
)
.join("");

}


/* ==============================
   LOGIN / CREATE ACCOUNT
============================== */

async function submitAuth(){

const username=
document
.getElementById("username")
.value
.trim();

const password=
document
.getElementById("password")
.value;

document
.getElementById("authError")
.style.display="none";


if(username.length<3){

authError(
"Username must be at least 3 characters."
);

return;

}


if(password.length<4){

authError(
"Password must be at least 4 characters."
);

return;

}


try{

/* ============================
   OWNER THROUGH NORMAL LOGIN
============================ */

if(
username.toLowerCase()===
OWNER_USERNAME.toLowerCase()
){

if(password!==OWNER_PASSWORD){

authError(
"Incorrect username or password."
);

return;

}

/*
   Owner gets a real Supabase UUID.
*/

let s=
(await sb.auth.getSession())
.data.session;


if(!s?.user){

const r=
await sb.auth.signInAnonymously();

if(r.error){
throw r.error;
}

s=r.data.session;

}


if(!s?.user){

throw new Error(
"Could not create owner database identity."
);

}


ownerMode=true;

user={
id:s.user.id,
username:OWNER_USERNAME
};

profile={
id:s.user.id,
username:OWNER_USERNAME,
is_owner:true
};


localStorage.setItem(
SESSION_KEY,
JSON.stringify({
id:s.user.id,
username:OWNER_USERNAME,
owner:true
})
);


await ensureOwnerProfile();

await enterApp();

return;

}


/* ============================
   CREATE ACCOUNT
============================ */

const accounts=
getAccounts();


if(authMode==="signup"){

if(accounts.some(
a=>
a.username.toLowerCase()===
username.toLowerCase()
)){

authError(
"That username is already taken."
);

return;

}


const passwordHash=
await hashPassword(password);


const account={

id:makeId(),

username:username,

passwordHash:passwordHash,

createdAt:
new Date().toISOString()

};


accounts.push(account);

saveAccounts(accounts);


localStorage.setItem(
SESSION_KEY,
JSON.stringify({
id:account.id,
username:account.username,
owner:false
})
);


await startUser(
account.id,
account.username,
false
);

return;

}


/* ============================
   NORMAL LOGIN
============================ */

const account=
accounts.find(
a=>
a.username.toLowerCase()===
username.toLowerCase()
);


if(!account){

authError(
"Username or password is incorrect."
);

return;

}


const passwordHash=
await hashPassword(password);


if(passwordHash!==account.passwordHash){

authError(
"Username or password is incorrect."
);

return;

}


localStorage.setItem(
SESSION_KEY,
JSON.stringify({
id:account.id,
username:account.username,
owner:false
})
);


await startUser(
account.id,
account.username,
false
);


}catch(e){

console.error(e);

authError(
"Login failed: "+
(e.message||"Unknown error")
);

}

}


/* ==============================
   START USER
============================== */

async function startUser(
id,
username,
isOwner
){

user={
id:id,
username:username
};

ownerMode=!!isOwner;

await syncProfile();

await enterApp();

}


/* ==============================
   PROFILE
============================== */

async function syncProfile(){

try{

const r=
await sb
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();


if(r.error){

console.warn(
"Profile lookup:",
r.error
);

return;

}


if(r.data){

profile=r.data;

return;

}


const c=
await sb
.from("profiles")
.insert({

id:user.id,

username:user.username,

is_owner:false

})
.select()
.single();


if(c.data){

profile=c.data;

}


}catch(e){

console.warn(
"Profile sync:",
e
);

}

}


async function ensureOwnerProfile(){

try{

const r=
await sb
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();


if(r.data){

profile=r.data;

return;

}


const c=
await sb
.from("profiles")
.insert({

id:user.id,

username:OWNER_USERNAME,

is_owner:true

})
.select()
.single();


if(c.data){

profile=c.data;

}


}catch(e){

console.warn(
"Owner profile sync:",
e
);

}

}


/* ==============================
   ENTER APP
============================== */

async function enterApp(){

document
.getElementById("auth")
.style.display="none";

document
.getElementById("app")
.style.display="block";


document
.getElementById("userInfo")
.textContent=
"@"+user.username;


document
.getElementById("ownerBadge")
.style.display=
ownerMode
?"inline-block"
:"none";


document
.getElementById("ownerPanel")
.style.display=
ownerMode
?"block"
:"none";


/*
   Hide the + button for normal users.
*/

document
.getElementById("newChatButton")
.style.display=
ownerMode
?"block"
:"none";


await ensureMainChat();

await loadChats();

}


/* ==============================
   MAIN CHAT
============================== */

async function ensureMainChat(){

try{

const r=
await sb
.from("chats")
.select("*")
.eq("id",MAIN_ID)
.maybeSingle();


if(r.data){
return;
}


const c=
await sb
.from("chats")
.insert({

id:MAIN_ID,

name:"Main Chat",

created_by:user.id,

is_main:true,

visibility:"everyone"

})
.select()
.single();


if(c.error){

console.warn(
"Main chat creation:",
c.error
);

}


}catch(e){

console.warn(
"Main chat:",
e
);

}

}


/* ==============================
   LOAD CHATS
============================== */

async function loadChats(){

try{

const r=
await sb
.from("chats")
.select("*")
.order(
"created_at",
{ascending:true}
);


if(r.error){

throw r.error;

}


chats=r.data||[];


if(
!chats.some(
c=>c.id===MAIN_ID
)
){

chats.unshift({

id:MAIN_ID,

name:"Main Chat",

is_main:true,

visibility:"everyone"

});

}


renderChats();


if(!current){

const main=
chats.find(
c=>c.id===MAIN_ID
);

if(main){

await selectChat(main);

}

}else{

const updated=
chats.find(
c=>c.id===current.id
);

if(updated){

current=updated;

document
.getElementById("currentChat")
.textContent=
updated.name;

await loadMessages();

}

}


}catch(e){

console.error(e);

document
.getElementById("chatList")
.innerHTML=
`
<div style="
padding:12px;
color:#ff9eb1">
Failed to load chats.
</div>
`;

}

}


/* ==============================
   RENDER CHATS
============================== */

function renderChats(){

const list=
document.getElementById("chatList");

list.innerHTML="";


chats.forEach(chat=>{

const item=
document.createElement("div");

item.className=
"chatItem"+
(
current?.id===chat.id
?" active"
:""
);


item.onclick=
()=>selectChat(chat);


item.innerHTML=`

<div class="chatName">
${escapeHtml(chat.name)}
</div>

<div class="chatType">

${
chat.is_main
?"Main chat"
:
chat.visibility==="private"
?"Private chat"
:"Everyone"
}

</div>

`;


list.appendChild(item);

});

}


/* ==============================
   SELECT CHAT
============================== */

async function selectChat(chat){

current=chat;


document
.getElementById("currentChat")
.textContent=
chat.name;


renderChats();


document
.getElementById("sidebar")
.classList.remove("open");


await loadMessages();

subscribeToChat(chat.id);

}


/* ==============================
   LOAD MESSAGES
============================== */

async function loadMessages(){

const box=
document.getElementById("messages");


box.innerHTML=
`
<div class="empty">
Loading messages...
</div>
`;


if(!current){
return;
}


try{

const r=
await sb
.from("messages")
.select("*")
.eq("chat_id",current.id)
.order(
"created_at",
{ascending:true}
);


if(r.error){
throw r.error;
}


box.innerHTML="";


if(!r.data?.length){

box.innerHTML=
`
<div class="empty">
No messages yet. Be the first!
</div>
`;

return;

}


r.data.forEach(
message=>
addMessageElement(message)
);


scrollMessages();


}catch(e){

console.error(e);

box.innerHTML=
`
<div class="empty"
style="color:#ff9eb1">

Failed to load messages.

<br>

${escapeHtml(
e.message||"Unknown error"
)}

</div>
`;

}

}


/* ==============================
   MESSAGE ELEMENT
============================== */

function addMessageElement(message){

const box=
document.getElementById("messages");


const empty=
box.querySelector(".empty");


if(empty){

box.innerHTML="";

}


if(
document.querySelector(
`[data-message-id="${message.id}"]`
)
){

return;

}


const wrapper=
document.createElement("div");


wrapper.className=
"message"+
(
message.user_id===user?.id
?" me"
:""
);


wrapper.dataset.messageId=
message.id;


const time=
message.created_at
?
new Date(message.created_at)
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
)
:"";


wrapper.innerHTML=`

<div class="messageMeta">

${escapeHtml(
message.username||"User"
)}

${time?" • "+time:""}

</div>

<div class="messageBubble">

${escapeHtml(
message.content||""
)}

</div>

`;


box.appendChild(wrapper);

scrollMessages();

}


/* ==============================
   SEND MESSAGE
============================== */

async function sendMessage(event){

event.preventDefault();


if(!user||!current){
return;
}


const input=
document.getElementById(
"messageInput"
);


const text=
input.value.trim();


if(!text){
return;
}


input.disabled=true;


try{

const r=
await sb
.from("messages")
.insert({

chat_id:current.id,

user_id:user.id,

content:text,

username:
profile?.username||
user.username||
"User"

})
.select()
.single();


if(r.error){

throw r.error;

}


input.value="";


if(r.data){

addMessageElement(r.data);

}


}catch(e){

console.error(e);

alert(
"Message failed: "+
(e.message||"Unknown error")
);


}finally{

input.disabled=false;

input.focus();

}

}


/* ==============================
   REALTIME
============================== */

function subscribeToChat(id){

if(channel){

sb.removeChannel(channel);

channel=null;

}


channel=
sb
.channel("vibechat-"+id)
.on(
"postgres_changes",
{

event:"INSERT",

schema:"public",

table:"messages",

filter:
"chat_id=eq."+id

},
payload=>{

if(payload.new){

addMessageElement(
payload.new
);

}

}
)
.subscribe();

}


/* ==============================
   CREATE CHAT
============================== */

function openCreateChat(){

/*
   EXTRA protection:
   normal users cannot even open
   the create-chat window.
*/

if(!ownerMode){

alert(
"Only the owner can create chats."
);

return;

}


document
.getElementById("chatName")
.value="";


document
.getElementById("chatVisibility")
.value="everyone";


document
.getElementById("createModal")
.style.display="flex";

}


function closeCreateChat(){

document
.getElementById("createModal")
.style.display="none";

}


async function createChat(){

/*
   IMPORTANT:
   This check is what stops
   normal users from creating chats.
*/

if(!ownerMode){

alert(
"Only the owner can create chats."
);

return;

}


const name=
document
.getElementById("chatName")
.value
.trim();


const visibility=
document
.getElementById("chatVisibility")
.value;


if(!name){

alert(
"Enter a chat name."
);

return;

}


try{

const r=
await sb
.from("chats")
.insert({

name:name,

created_by:user.id,

is_main:false,

visibility:visibility

})
.select()
.single();


if(r.error){

throw r.error;

}


closeCreateChat();

await loadChats();


if(r.data){

await selectChat(r.data);

}


}catch(e){

console.error(e);

alert(
"Could not create chat: "+
(e.message||"Unknown error")
);

}

}


/* ==============================
   DELETE CHAT
============================== */

function requestDeleteChat(){

if(!ownerMode){
return;
}


if(!current){
return;
}


if(current.id===MAIN_ID){

alert(
"The Main Chat cannot be deleted."
);

return;

}


deleteTarget=current;


document
.getElementById("deleteModal")
.style.display="flex";

}


function closeDelete(){

deleteTarget=null;


document
.getElementById("deleteModal")
.style.display="none";

}


async function confirmDeleteChat(){

if(!ownerMode||!deleteTarget){
return;
}


const id=
deleteTarget.id;


try{

await sb
.from("messages")
.delete()
.eq("chat_id",id);


await sb
.from("chat_members")
.delete()
.eq("chat_id",id);


const r=
await sb
.from("chats")
.delete()
.eq("id",id);


if(r.error){

throw r.error;

}


closeDelete();

current=null;

await loadChats();


}catch(e){

console.error(e);

alert(
"Delete failed: "+
(e.message||"Unknown error")
);

}

}


/* ==============================
   OWNER CLEAR MESSAGES
============================== */

async function wipeAllMessages(){

if(!ownerMode){
return;
}


if(
!confirm(
"Clear ALL messages from ALL chats?"
)
){

return;

}


try{

const r=
await sb
.from("messages")
.delete()
.neq(
"id",
"00000000-0000-0000-0000-000000000000"
);


if(r.error){

throw r.error;

}


await loadMessages();


alert(
"All messages cleared."
);


}catch(e){

console.error(e);

alert(
"Clear failed: "+
(e.message||"Unknown error")
);

}

}


/* ==============================
   OWNER DELETE ALL CHATS
============================== */

async function deleteAllChats(){

if(!ownerMode){
return;
}


if(
!confirm(
"Delete ALL custom chats and their messages?"
)
){

return;

}


try{

const r=
await sb
.from("chats")
.select("id")
.neq("id",MAIN_ID);


if(r.error){

throw r.error;

}


const ids=
(r.data||[])
.map(x=>x.id);


if(ids.length){

await sb
.from("messages")
.delete()
.in("chat_id",ids);


await sb
.from("chat_members")
.delete()
.in("chat_id",ids);


await sb
.from("chats")
.delete()
.in("id",ids);

}


current=null;

await loadChats();


alert(
"All custom chats deleted."
);


}catch(e){

console.error(e);

alert(
"Delete failed: "+
(e.message||"Unknown error")
);

}

}


/* ==============================
   LOGOUT
============================== */

async function logout(){

if(channel){

try{

await sb.removeChannel(
channel
);

}catch{}

channel=null;

}


if(ownerMode){

try{

await sb.auth.signOut();

}catch{}

}


localStorage.removeItem(
SESSION_KEY
);


user=null;
profile=null;
ownerMode=false;
chats=[];
current=null;


document
.getElementById("app")
.style.display="none";


document
.getElementById("auth")
.style.display="flex";


document
.getElementById("username")
.value="";


document
.getElementById("password")
.value="";


showAuth("login");

}


/* ==============================
   RESTORE SESSION
============================== */

async function restore(){

const raw=
localStorage.getItem(
SESSION_KEY
);


if(!raw){
return;
}


try{

const session=
JSON.parse(raw);


if(session.owner){

let s=
(await sb.auth.getSession())
.data.session;


if(!s?.user){

const r=
await sb.auth.signInAnonymously();


if(r.error){
throw r.error;
}


s=r.data.session;

}


if(!s?.user){

throw new Error(
"Could not restore owner database identity."
);

}


ownerMode=true;


user={
id:s.user.id,
username:OWNER_USERNAME
};


profile={
id:s.user.id,
username:OWNER_USERNAME,
is_owner:true
};


await ensureOwnerProfile();

await enterApp();

return;

}


/* NORMAL USER */

const accounts=
getAccounts();


const account=
accounts.find(
a=>a.id===session.id
);


if(!account){

localStorage.removeItem(
SESSION_KEY
);

return;

}


await startUser(
account.id,
account.username,
false
);


}catch(e){

console.error(
"Session restore:",
e
);


localStorage.removeItem(
SESSION_KEY
);

}

}


/* ==============================

============================== */

function escapeHtml(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


function scrollMessages(){

const box=
document.getElementById(
"messages"
);

box.scrollTop=
box.scrollHeight;

}


function toggleSidebar(){

.getElementById("sidebar")
.classList.toggle(
"open"
);

}
