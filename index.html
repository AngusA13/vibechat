<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeChat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: #090b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #10131d;
        }

        .topbar {
            padding: 18px 22px;
            background: #131722;
            border-bottom: 1px solid #292e3d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
        }

        .status {
            margin-top: 5px;
            color: #9da6ba;
            font-size: 13px;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #35e77a;
            border-radius: 50%;
            margin-right: 6px;
        }

        .clear-button {
            background: transparent;
            color: #aeb6c9;
            border: 1px solid #343b4d;
            padding: 9px 13px;
            border-radius: 9px;
            cursor: pointer;
        }

        .clear-button:hover {
            background: #1c2130;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty {
            margin: auto;
            text-align: center;
            color: #7f899e;
            font-size: 16px;
        }

        .message {
            max-width: 75%;
            background: #1b2030;
            padding: 12px 15px;
            border-radius: 15px;
            align-self: flex-start;
        }

        .message.mine {
            align-self: flex-end;
            background: #315cff;
        }

        .username {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .time {
            opacity: 0.6;
            font-weight: normal;
            margin-left: 6px;
        }

        .message-text {
            font-size: 15px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .composer {
            padding: 15px;
            background: #131722;
            border-top: 1px solid #292e3d;
            display: flex;
            gap: 9px;
        }

        input {
            background: #0c0f17;
            color: white;
            border: 1px solid #30374a;
            border-radius: 10px;
            padding: 12px;
            outline: none;
        }

        input:focus {
            border-color: #5578ff;
        }

        #username {
            width: 150px;
        }

        #message {
            flex: 1;
        }

        .send-button {
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            background: #315cff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .send-button:hover {
            background: #466dff;
        }

        @media (max-width: 600px) {
            #username {
                width: 100px;
            }

            .message {
                max-width: 88%;
            }

            .messages {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div>
            <div class="title">💬 VibeChat</div>

            <div class="status">
                <span class="online-dot"></span>
                Online
            </div>
        </div>

        <button class="clear-button" onclick="clearChat()">
            Clear Chat
        </button>

    </header>


    <main id="messages" class="messages">

        <div id="emptyMessage" class="empty">
            No messages yet.<br>
            Start the vibe 💬
        </div>

    </main>


    <form class="composer" onsubmit="sendMessage(event)">

        <input
            id="username"
            maxlength="24"
            placeholder="Your name"
            autocomplete="nickname"
        >

        <input
            id="message"
            maxlength="500"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button class="send-button" type="submit">
            Send
        </button>

    </form>

</div>


<script>

    let messages = JSON.parse(
        localStorage.getItem("vibechat_messages") || "[]"
    );

    const usernameInput =
        document.getElementById("username");

    const messageInput =
        document.getElementById("message");

    const messagesContainer =
        document.getElementById("messages");

    const emptyMessage =
        document.getElementById("emptyMessage");


    usernameInput.value =
        localStorage.getItem("vibechat_username") || "";


    function escapeHTML(text) {

        const element =
            document.createElement("div");

        element.textContent = text;

        return element.innerHTML;
    }


    function saveMessages() {

        localStorage.setItem(
            "vibechat_messages",
            JSON.stringify(messages)
        );
    }


    function displayMessages() {

        messagesContainer.innerHTML = "";

        if (messages.length === 0) {

            messagesContainer.innerHTML = `
                <div class="empty">
                    No messages yet.<br>
                    Start the vibe 💬
                </div>
            `;

            return;
        }


        messages.forEach(message => {

            const bubble =
                document.createElement("div");


            const currentUsername =
                usernameInput.value.trim();


            bubble.className =
                "message" +
                (
                    message.username === currentUsername
                        ? " mine"
                        : ""
                );


            const time =
                new Date(message.time)
                .toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });


            bubble.innerHTML = `

                <div class="username">

                    ${escapeHTML(message.username)}

                    <span class="time">
                        ${time}
                    </span>

                </div>

                <div class="message-text">
                    ${escapeHTML(message.text)}
                </div>

            `;


            messagesContainer.appendChild(bubble);

        });


        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;
    }


    function sendMessage(event) {

        event.preventDefault();


        const username =
            usernameInput.value.trim() ||
            "Anonymous";


        const text =
            messageInput.value.trim();


        if (!text) {
            return;
        }


        localStorage.setItem(
            "vibechat_username",
            username
        );


        messages.push({

            username: username,

            text: text,

            time: new Date().toISOString()

        });


        saveMessages();


        messageInput.value = "";


        displayMessages();


        messageInput.focus();

    }


    function clearChat() {

        if (!confirm("Clear the chat on this browser?")) {
            return;
        }


        messages = [];


        saveMessages();


        displayMessages();

    }


    displayMessages();

</script>

</body>
</html>
