<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeChat 2.0</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: #070910;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

button,
input {
    font-family: inherit;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    background: #10131d;
}


/* SIDEBAR */

.sidebar {
    width: 235px;
    background: #0d1018;
    border-right: 1px solid #292e3d;
    display: flex;
    flex-direction: column;
}

.logo {
    padding: 21px;
    font-size: 25px;
    font-weight: bold;
    border-bottom: 1px solid #292e3d;
}

.logo span {
    color: #5b7cff;
}

.version {
    font-size: 10px;
    color: #6f7890;
    margin-left: 5px;
}

.rooms-title {
    padding: 18px 16px 8px;
    color: #788197;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
}

.room {
    margin: 3px 10px;
    padding: 12px;
    border-radius: 9px;
    color: #aeb6c9;
    cursor: pointer;
    transition: .15s;
}

.room:hover {
    background: #191e2b;
    color: white;
}

.room.active {
    background: #315cff;
    color: white;
}


/* MAIN CHAT */

.chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}


/* TOP BAR */

.topbar {
    min-height: 75px;
    padding: 13px 20px;
    background: #131722;
    border-bottom: 1px solid #292e3d;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.room-name {
    font-size: 20px;
    font-weight: bold;
}

.room-status {
    margin-top: 5px;
    color: #8993a8;
    font-size: 12px;
}

.online-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #35e77a;
    border-radius: 50%;
    margin-right: 6px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 9px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #315cff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    user-select: none;
}

.profile-name {
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}


/* MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.empty {
    margin: auto;
    text-align: center;
    color: #737d92;
    line-height: 1.6;
}

.message {
    max-width: min(75%, 650px);
    padding: 11px 14px;
    border-radius: 15px;
    background: #1b2030;
    align-self: flex-start;
    position: relative;
    word-wrap: break-word;
    overflow-wrap: anywhere;
}

.message.mine {
    align-self: flex-end;
    background: #315cff;
}

.message-header {
    display: flex;
    align-items: center;
    margin-bottom: 5px;
}

.message-avatar {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #566ff0;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    font-size: 10px;
    font-weight: bold;
    margin-right: 7px;
}

.message.mine .message-avatar {
    background: rgba(255,255,255,.2);
}

.username {
    font-size: 12px;
    font-weight: bold;
}

.time {
    opacity: .55;
    font-size: 11px;
    font-weight: normal;
    margin-left: 7px;
}

.message-text {
    font-size: 15px;
    line-height: 1.45;
}

.sent {
    font-size: 10px;
    margin-left: 6px;
    opacity: .75;
}


/* COMPOSER */

.composer {
    padding: 14px;
    background: #131722;
    border-top: 1px solid #292e3d;
    display: flex;
    gap: 8px;
}

input {
    background: #0c0f17;
    color: white;
    border: 1px solid #30374a;
    border-radius: 10px;
    padding: 12px;
    outline: none;
}

input:focus {
    border-color: #5578ff;
}

#username {
    width: 145px;
}

#message {
    flex: 1;
}

.send-button {
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    background: #315cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.send-button:hover {
    background: #466dff;
}

.emoji-button {
    width: 46px;
    border: none;
    border-radius: 10px;
    background: #202637;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.emoji-button:hover {
    background: #2b3348;
}


/* EMOJI PANEL */

.emoji-panel {
    position: absolute;
    bottom: 78px;
    right: 70px;
    width: 250px;
    padding: 12px;
    background: #151a27;
    border: 1px solid #30374a;
    border-radius: 13px;
    display: none;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
}

.emoji-panel.show {
    display: grid;
}

.emoji {
    border: none;
    background: transparent;
    color: white;
    font-size: 21px;
    padding: 6px;
    border-radius: 7px;
    cursor: pointer;
}

.emoji:hover {
    background: #252c40;
}


/* TOAST */

.toast {
    position: fixed;
    bottom: 85px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #202638;
    border: 1px solid #343c52;
    padding: 11px 16px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 20;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}


/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        width: 70px;
    }

    .logo {
        padding: 18px 8px;
        text-align: center;
        font-size: 0;
    }

    .logo::before {
        content: "💬";
        font-size: 24px;
    }

    .version {
        display: none;
    }

    .rooms-title {
        display: none;
    }

    .room {
        text-align: center;
        margin: 5px;
        padding: 12px 5px;
        font-size: 0;
    }

    .room::first-letter {
        font-size: 20px;
    }

    .room-name {
        font-size: 17px;
    }

    .profile-name {
        display: none;
    }

    .message {
        max-width: 88%;
    }

    #username {
        width: 95px;
    }

    .send-button {
        padding: 0 14px;
    }

    .emoji-panel {
        right: 12px;
        bottom: 78px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Vibe<span>Chat</span>
            <span class="version">2.0</span>
        </div>


        <div class="rooms-title">
            Chat rooms
        </div>


        <div
            class="room active"
            data-room="general"
            onclick="switchRoom('general')"
        >
            💬 General
        </div>


        <div
            class="room"
            data-room="minecraft"
            onclick="switchRoom('minecraft')"
        >
            🎮 Minecraft
        </div>


        <div
            class="room"
            data-room="gaming"
            onclick="switchRoom('gaming')"
        >
            🕹️ Gaming
        </div>


        <div
            class="room"
            data-room="memes"
            onclick="switchRoom('memes')"
        >
            😂 Memes
        </div>

    </aside>



    <!-- CHAT -->

    <section class="chat">


        <header class="topbar">

            <div>

                <div
                    id="roomName"
                    class="room-name"
                >
                    💬 General
                </div>


                <div class="room-status">

                    <span class="online-dot"></span>

                    <span id="connectionStatus">
                        Connecting...
                    </span>

                </div>

            </div>


            <div class="profile">

                <div
                    id="profileAvatar"
                    class="avatar"
                >
                    ?
                </div>

                <div
                    id="profileName"
                    class="profile-name"
                >
                    Anonymous
                </div>

            </div>

        </header>



        <!-- MESSAGES -->

        <main
            id="messages"
            class="messages"
        >

            <div
                id="empty"
                class="empty"
            >
                Connecting to VibeChat...
            </div>

        </main>



        <!-- EMOJI PANEL -->

        <div
            id="emojiPanel"
            class="emoji-panel"
        >

            <button class="emoji" onclick="addEmoji('😀')">😀</button>
            <button class="emoji" onclick="addEmoji('😂')">😂</button>
            <button class="emoji" onclick="addEmoji('🤣')">🤣</button>
            <button class="emoji" onclick="addEmoji('😎')">😎</button>
            <button class="emoji" onclick="addEmoji('🔥')">🔥</button>
            <button class="emoji" onclick="addEmoji('💀')">💀</button>
            <button class="emoji" onclick="addEmoji('😭')">😭</button>

            <button class="emoji" onclick="addEmoji('👍')">👍</button>
            <button class="emoji" onclick="addEmoji('👎')">👎</button>
            <button class="emoji" onclick="addEmoji('❤️')">❤️</button>
            <button class="emoji" onclick="addEmoji('💯')">💯</button>
            <button class="emoji" onclick="addEmoji('🎮')">🎮</button>
            <button class="emoji" onclick="addEmoji('🗿')">🗿</button>
            <button class="emoji" onclick="addEmoji('🤨')">🤨</button>

            <button class="emoji" onclick="addEmoji('😅')">😅</button>
            <button class="emoji" onclick="addEmoji('😭')">😭</button>
            <button class="emoji" onclick="addEmoji('🙃')">🙃</button>
            <button class="emoji" onclick="addEmoji('🤯')">🤯</button>
            <button class="emoji" onclick="addEmoji('🚀')">🚀</button>
            <button class="emoji" onclick="addEmoji('⚡')">⚡</button>
            <button class="emoji" onclick="addEmoji('✨')">✨</button>

        </div>



        <!-- COMPOSER -->

        <form
            id="chatForm"
            class="composer"
        >

            <input
                id="username"
                maxlength="24"
                placeholder="Your name"
                autocomplete="nickname"
            >


            <button
                type="button"
                class="emoji-button"
                onclick="toggleEmoji()"
            >
                😀
            </button>


            <input
                id="message"
                maxlength="500"
                placeholder="Type a message..."
                autocomplete="off"
            >


            <button
                type="submit"
                class="send-button"
            >
                Send
            </button>

        </form>

    </section>

</div>


<div
    id="toast"
    class="toast"
>
</div>



<script>


/* =========================================
   VIBECHAT 2.0
   ========================================= */


/* YOUR CHAT TOPICS */

const rooms = {

    general: {
        name: "💬 General",
        topic: "vibechat-7f4k2m9x-general"
    },

    minecraft: {
        name: "🎮 Minecraft",
        topic: "vibechat-7f4k2m9x-minecraft"
    },

    gaming: {
        name: "🕹️ Gaming",
        topic: "vibechat-7f4k2m9x-gaming"
    },

    memes: {
        name: "😂 Memes",
        topic: "vibechat-7f4k2m9x-memes"
    }

};


let currentRoom = "general";

let eventSource = null;

let myUsername =
    localStorage.getItem("vibechat_username") || "";

let messageIds =
    new Set();


/* ELEMENTS */

const usernameInput =
    document.getElementById("username");

const messageInput =
    document.getElementById("message");

const messagesContainer =
    document.getElementById("messages");

const roomName =
    document.getElementById("roomName");

const connectionStatus =
    document.getElementById("connectionStatus");

const profileAvatar =
    document.getElementById("profileAvatar");

const profileName =
    document.getElementById("profileName");

const emojiPanel =
    document.getElementById("emojiPanel");

const chatForm =
    document.getElementById("chatForm");

const toast =
    document.getElementById("toast");


usernameInput.value = myUsername;

updateProfile();


/* =========================================
   PROFILE
   ========================================= */

function updateProfile() {

    const name =
        usernameInput.value.trim() ||
        "Anonymous";

    profileName.textContent =
        name;

    const first =
        name.charAt(0).toUpperCase();

    profileAvatar.textContent =
        first;

}


/* =========================================
   HTML SECURITY
   ========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================
   TIME
   ========================================= */

function formatTime(timestamp) {

    const date =
        new Date(timestamp);

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================
   ADD MESSAGE
   ========================================= */

function addMessage(
    username,
    text,
    timestamp,
    mine,
    id
) {

    if (messageIds.has(id)) {
        return;
    }

    messageIds.add(id);


    const oldEmpty =
        document.getElementById("empty");

    if (oldEmpty) {
        oldEmpty.remove();
    }


    const bubble =
        document.createElement("div");

    bubble.className =
        "message" +
        (mine ? " mine" : "");


    const initial =
        (username || "A")
        .charAt(0)
        .toUpperCase();


    bubble.innerHTML = `

        <div class="message-header">

            <span class="message-avatar">
                ${escapeHTML(initial)}
            </span>

            <span class="username">
                ${escapeHTML(username || "Anonymous")}
            </span>

            <span class="time">
                ${formatTime(timestamp)}
            </span>

            ${
                mine
                ? '<span class="sent">✓ Sent</span>'
                : ''
            }

        </div>


        <div class="message-text">
            ${escapeHTML(text)}
        </div>

    `;


    messagesContainer.appendChild(
        bubble
    );


    messagesContainer.scrollTop =
        messagesContainer.scrollHeight;

}


/* =========================================
   CONNECT TO ROOM
   ========================================= */

function connectToRoom() {

    if (eventSource) {

        eventSource.close();

        eventSource = null;

    }


    messageIds.clear();

    messagesContainer.innerHTML = `

        <div
            id="empty"
            class="empty"
        >
            Connecting to ${escapeHTML(
                rooms[currentRoom].name
            )}...
        </div>

    `;


    const topic =
        rooms[currentRoom].topic;


    const url =
        "https://ntfy.sh/" +
        encodeURIComponent(topic) +
        "/sse";


    eventSource =
        new EventSource(url);


    eventSource.onopen =
        function() {

            connectionStatus.textContent =
                "Connected";

        };


    eventSource.onerror =
        function() {

            connectionStatus.textContent =
                "Reconnecting...";

        };


    eventSource.onmessage =
        function(event) {

            try {

                const data =
                    JSON.parse(event.data);


                if (
                    data.event !==
                    "message"
                ) {
                    return;
                }


                const raw =
                    data.message || "";


                const separator =
                    raw.indexOf("|");


                if (separator === -1) {
                    return;
                }


                const username =
                    raw.substring(
                        0,
                        separator
                    );


                const text =
                    raw.substring(
                        separator + 1
                    );


                const timestamp =
                    data.time
                    ? data.time * 1000
                    : Date.now();


                const id =
                    String(
                        data.id ||
                        (
                            data.time +
                            "-" +
                            username +
                            "-" +
                            text
                        )
                    );


                const mine =
                    username ===
                    usernameInput.value.trim();


                addMessage(
                    username,
                    text,
                    timestamp,
                    mine,
                    id
                );


                if (!mine) {

                    playNotificationSound();

                    showBrowserNotification(
                        username,
                        text
                    );

                }

            }

            catch(error) {

                console.error(
                    "Message error:",
                    error
                );

            }

        };

}


/* =========================================
   SWITCH ROOMS
   ========================================= */

function switchRoom(room) {

    if (!rooms[room]) {
        return;
    }


    currentRoom =
        room;


    document
        .querySelectorAll(".room")
        .forEach(element => {

            element.classList.toggle(
                "active",
                element.dataset.room === room
            );

        });


    roomName.textContent =
        rooms[room].name;


    connectToRoom();


    showToast(
        "Switched to " +
        rooms[room].name
    );

}


/* =========================================
   SEND MESSAGE
   ========================================= */

chatForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            usernameInput.value.trim() ||
            "Anonymous";


        const text =
            messageInput.value.trim();


        if (!text) {
            return;
        }


        localStorage.setItem(
            "vibechat_username",
            username
        );


        myUsername =
            username;


        updateProfile();


        const topic =
            rooms[currentRoom].topic;


        try {

            const response =
                await fetch(
                    "https://ntfy.sh/" +
                    encodeURIComponent(topic),
                    {
                        method: "POST",
                        body:
                            username +
                            "|" +
                            text
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Message failed"
                );

            }


            messageInput.value =
                "";


            messageInput.focus();


            showToast(
                "✓ Message sent"
            );

        }

        catch(error) {

            console.error(error);


            showToast(
                "❌ Couldn't send message"
            );

        }

    }
);


/* =========================================
   USERNAME CHANGES
   ========================================= */

usernameInput.addEventListener(
    "input",
    function() {

        updateProfile();

    }
);


usernameInput.addEventListener(
    "change",
    function() {

        const name =
            usernameInput.value.trim();

        if (name) {

            localStorage.setItem(
                "vibechat_username",
                name
            );

        }

        updateProfile();

    }
);


/* =========================================
   EMOJIS
   ========================================= */

function toggleEmoji() {

    emojiPanel.classList.toggle(
        "show"
    );

}


function addEmoji(emoji) {

    messageInput.value +=
        emoji;

    messageInput.focus();

}


document.addEventListener(
    "click",
    function(event) {

        if (
            !emojiPanel.contains(event.target) &&
            !event.target.closest(".emoji-button")
        ) {

            emojiPanel.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================
   TOAST
   ========================================= */

let toastTimer;


function showToast(text) {

    toast.textContent =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================
   NOTIFICATION SOUND
   ========================================= */

let audioContext = null;


function playNotificationSound() {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            660;


        gain.gain.setValueAtTime(
            0.0001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.08,
            audioContext.currentTime + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + 0.16
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + 0.17
        );

    }

    catch(error) {

        console.log(
            "Sound unavailable"
        );

    }

}


/* =========================================
   BROWSER NOTIFICATIONS
   ========================================= */

async function requestNotifications() {

    if (
        "Notification" in window &&
        Notification.permission ===
        "default"
    ) {

        try {

            await Notification.requestPermission();

        }

        catch(error) {

            console.log(error);

        }

    }

}


function showBrowserNotification(
    username,
    text
) {

    if (
        !("Notification" in window)
    ) {
        return;
    }


    if (
        Notification.permission !==
        "granted"
    ) {
        return;
    }


    if (
        document.visibilityState ===
        "visible"
    ) {
        return;
    }


    new Notification(
        "VibeChat — " + username,
        {
            body: text,
            tag: "vibechat-message"
        }
    );

}


/* =========================================
   KEYBOARD SHORTCUTS
   ========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            emojiPanel.classList.remove(
                "show"
            );

        }


        if (
            event.key === "Enter" &&
            document.activeElement ===
            messageInput &&
            !event.shiftKey
        ) {

            event.preventDefault();

            chatForm.requestSubmit();

        }

    }
);


/* =========================================
   START
   ========================================= */

requestNotifications();

connectToRoom();


</script>

</body>
</html>
